# SimVP radar-only ablation configuration.
#
# Constructor kwargs below are the real keyword arguments of
# models/simvp/model.py :: SimVPRadarOnly.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the latent feature maps.
  hid_c: 64

paper: "SimVP: Simulating Video Dynamics via Learning Predictive Tokens (ICLR 2022), arXiv 2206.13079"
repo: null
license: "n/a (no code released)"
notes: "Ablation baseline: the same SimVP core as simvp_v2, but with no NWP input at all. It is the structural counterpart of the --no-nwp ablation -- the ablation keeps the architecture and removes the information, this one removes both -- so the two together say how much of the gap is the network and how much is the fields."
