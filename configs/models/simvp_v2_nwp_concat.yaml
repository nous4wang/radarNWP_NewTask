# SimVP-v2 with the NWP concatenated onto the radar input.
#
# Constructor kwargs below are the real keyword arguments of
# models/simvp_v2_nwp_concat/model.py :: SimVPv2NWPConcat.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the latent feature maps.
  hid_c: 64
  # Number of spatio-temporal translation blocks.
  num_blocks: 4

paper: "SimVP: Simulating Video Dynamics via Learning Predictive Tokens (ICLR 2022), arXiv 2206.13079"
repo: null
license: "n/a (no code released)"
notes: "Ablation row M1 of the NWP-injection study: the NWP forecast slice is pasted onto the radar history on the input channels, so the first convolution sees 37 of them, and the backbone is SimVP-v2's unchanged. It is the control that answers 'does merely having the NWP help?', against which the cross-attention row and the tendency-difference row are read."
