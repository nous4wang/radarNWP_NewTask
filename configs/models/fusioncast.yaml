# FusionCast adapter configuration.
#
# Constructor kwargs below are the real keyword arguments of
# radar_nwp_bench/models/fusioncast/model.py :: FusionCastAdapter.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the ConvLSTM states.
  channels: 32
  # Width of the internal convolutions.
  hidden: 32
  # Bound of the log-space rainfall increment.
  max_log_delta: 4.0

paper: "FusionCast: Enhancing Precipitation Nowcasting with Asymmetric Cross-Modal Fusion and Future Radar Priors, arXiv:2603.13298"
repo: "https://github.com/wanghenan123/FusionCast"
license: "NOASSERTION (no LICENSE file in upstream repo)"
notes: "Upstream second modality is GNSS PWV (substituted here by NWP) and its loss function is withheld upstream."
