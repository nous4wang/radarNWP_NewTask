# SimVP-v2 with the quantum-inspired NWP tendency plugin.
#
# Constructor kwargs below are the real keyword arguments of
# models/simvp_v2_quantum/model.py :: SimVPv2QuantumNWP.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the latent feature maps.
  hid_c: 64
  # Number of spatio-temporal translator blocks.
  num_blocks: 4

paper: "SimVP: Simulating Video Dynamics via Learning Predictive Tokens (ICLR 2022), arXiv 2206.13079"
repo: null
license: "n/a (no code released)"
notes: "The reference integration of the quantum-inspired NWP tendency coupler (QuantumStateProjector + KoopmanUnitaryFlow + FiLM). It exists to show that the coupling is a plug-in: the backbone, the head and the loss are SimVP-v2's, and the coupler is one line. Compare against simvp_v2 to see what the coupling buys."
