# SimVP early-concatenation ablation configuration.
#
# Constructor kwargs below are the real keyword arguments of
# models/simvp/model.py :: SimVPEarlyConcat.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the latent feature maps.
  hid_c: 64

paper: "SimVP: Simulating Video Dynamics via Learning Predictive Tokens (ICLR 2022), arXiv 2206.13079"
repo: null
license: "n/a (no code released)"
notes: "Ablation baseline: the NWP fields are broadcast along the channel axis and concatenated to the radar history, with no dedicated encoder and no fusion gate. It answers whether the naive way of adding NWP -- paste it onto the channels -- is already enough, which is the control the more elaborate fusion architectures have to beat."
