# SimVP-v2 with the NWP difference field in place of the NWP.
#
# Constructor kwargs below are the real keyword arguments of
# models/simvp_v2_nwp_delta/model.py :: SimVPv2NWPDelta.__init__.

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  # Width of the latent feature maps.
  hid_c: 64
  # Number of spatio-temporal translation blocks.
  num_blocks: 4

paper: "SimVP: Simulating Video Dynamics via Learning Predictive Tokens (ICLR 2022), arXiv 2206.13079"
repo: null
license: "n/a (no code released)"
notes: "Ablation row M3 of the NWP-injection study: the model is given the difference between the NWP's forecast hour and its analysis hour, and nothing else of the NWP. It is the control that answers 'is the tendency the useful part of the NWP, or is it the state?', because the difference is exactly the tendency without any Koopman or quantum-inspired machinery to extract it."
