# E45 / MASTER 4.47 -- A1: the amplitude-monotone gate.
#
# The single-variable claim: the ONLY difference from the control arm
# (simvp_v2 + balanced) is WHERE the gate's value comes from.  The
# backbone, the loss, the number of loss terms and the output contract
# are unchanged, and no new dependency is introduced.
#
# out = low + mask * resid,  mask = sigmoid((resid - thr) / T)
#
# The mask is a monotone increasing function of the residual and of
# nothing else, so corr(mask, resid) >= 0 holds BY CONSTRUCTION rather
# than by training.  E44 measured the opposite on its own checkpoint:
# corr(mask, amp) = -0.858320 and mask_at_peak = 0.195087.
#
# low_rank / monotone_gate false reproduce simvp_v2 bit for bit (the S0 gate).

model:
  in_radar_c: 10
  in_nwp_c: 27
  in_len: 11
  out_len: 10
  hid_c: 64
  num_blocks: 4
  r_low: 8
  gate_temp: 1.0
  low_rank: true
  monotone_gate: true

paper: "E45 internal pre-registration; docs/experiments/E45-gate-direction-amount-separation-baseline.md section 2.1"
repo: null
license: "n/a (project code)"
notes: "PRE-REGISTERED / NOT YET TRAINED."
