[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-nwp-bench"
version = "0.1.0"
description = "Unified benchmark for radar + NWP precipitation nowcasting with eight SOTA baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "einops>=0.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
# `radar_nwp_bench` holds the framework (data, metrics, the model seam);
# `models` holds the baseline implementations, one package per model, and is
# discovered by the registry rather than imported eagerly.
include = ["radar_nwp_bench*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
